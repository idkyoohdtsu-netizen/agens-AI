kind = "mobile"
previewPath = "/"
title = "Rem"
version = "1.0.0"
id = "artifacts/rem-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18281

[services.development]
run = "pnpm --filter @workspace/rem-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rem-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rem-app", "run", "serve" ]

[services.env]
PORT = "18281"
BASE_PATH = "/"
